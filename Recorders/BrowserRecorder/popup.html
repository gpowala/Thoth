<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Thoth Tests Recorder</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="popup">
        <header class="popup-header">
            <div class="brand">
                <span class="brand-mark">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"></circle>
                        <circle cx="12" cy="12" r="4" fill="currentColor"></circle>
                    </svg>
                </span>
                <span class="brand-text">
                    <span class="brand-title">Thoth</span>
                    <span class="brand-sub">Tests Recorder</span>
                </span>
            </div>
            <div class="status-pill" id="statusPill">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusLabel">Idle</span>
            </div>
        </header>

        <div class="field" id="sessionUrlContainer">
            <label for="sessionUrlInput">Session URL</label>
            <input type="text" id="sessionUrlInput" class="input" placeholder="Paste session URL here…">
        </div>

        <div class="actions">
            <button id="startRecordingBtn" class="btn btn-primary">Start recording</button>
            <button id="stopRecordingBtn" class="btn btn-stop" hidden>Stop recording</button>
        </div>

        <div id="errorLabel" class="error-label" hidden></div>

        <section class="shortcuts">
            <div class="shortcuts-title">Keyboard shortcuts</div>
            <ul class="shortcuts-list">
                <li>
                    <span class="shortcut-desc">Capture a screen area</span>
                    <span class="keys"><kbd>Alt</kbd><kbd>Shift</kbd><kbd>W</kbd></span>
                </li>
            </ul>
            <p class="shortcuts-hint">
                Clicks and typed keys are captured automatically while recording.
                After the shortcut, drag to select a region — a single click cancels it.
            </p>
        </section>
    </div>

    <script src="jquery/jquery-3.7.1.min.js"></script>
    <script src="popup.js"></script>
</body>
</html>
